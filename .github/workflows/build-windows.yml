name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-rust
      

      - name: Build with Cargo
        shell: msys2 {0}
        run: |
          cargo build --release

      - name: Prepare Artifacts
        shell: msys2 {0}
        run: |
          mkdir dist
          cp target/release/FolderPlay.exe dist/
          cp /mingw64/bin/libgtk-4-1.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libgio-2.0-0.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libgobject-2.0-0.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libglib-2.0-0.dll dist/ 2>/dev/null || true

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderPlay-Windows-x64
          path: dist/