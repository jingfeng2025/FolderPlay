name: Build Windows Executable

on:
  # 允许你手动在 Actions 页面触发编译
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 指定 Windows 编译目标
  TARGET: x86_64-pc-windows-gnu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 关键步骤：安装所有系统依赖，包括 GTK4 和 GStreamer
      - name: Install system dependencies (GTK4 & GStreamer)
        run: |
          sudo apt-get update
          # 安装 Windows 交叉编译工具链、pkg-config 以及所有图形和多媒体库
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            pkg-config \
            libgtk-4-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libadwaita-1-dev \
            librsvg2-dev \
            # 以下是新增的 GStreamer 相关开发包
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly
          
          # 设置环境变量，帮助 pkg-config 找到库路径，并允许交叉编译
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      # 使用更现代的 dtolnay/rust-toolchain 安装 Rust（解决旧版 Action 的警告）
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      # 创建 Cargo 配置文件，指定交叉编译用的链接器
      - name: Configure Cargo for cross-compilation
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      # 执行编译，添加 --verbose 以便出错时能看到更多细节
      - name: Build for Windows
        run: |
          cargo build --target ${{ env.TARGET }} --release --verbose

      # 上传生成的 .exe 文件
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FolderPlay-Windows-x64
          path: target/x86_64-pc-windows-gnu/release/FolderPlay.exe