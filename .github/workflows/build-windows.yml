name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装 MSYS2 及 GTK4 + Libadwaita 依赖
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-rust

      # 2. 在 MSYS2 MINGW64 环境下编译 Rust 项目
      - name: Build with Cargo
        shell: msys2 {0}
        run: |
          cargo build --release

      # 3. 收集产物与依赖的 DLL (包含 libadwaita 及相关依赖)
      - name: Prepare Artifacts
        shell: msys2 {0}
        run: |
          mkdir dist
          cp target/release/FolderPlay.exe dist/
          
          # 复制核心 GTK4 和 Libadwaita 的 DLL
          cp /mingw64/bin/libadwaita-1-0.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libgtk-4-1.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libgio-2.0-0.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libgobject-2.0-0.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libglib-2.0-0.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/pango*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/cairo*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/graphene*.dll dist/ 2>/dev/null || true

      # 4. 上传编译产物
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderPlay-Windows-x64
          path: dist/