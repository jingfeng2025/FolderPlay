name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装 MSYS2 及完整的 GTK4 / Libadwaita 依赖
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-rust

      # 2. 编译 Rust 项目
      - name: Build with Cargo
        shell: msys2 {0}
        run: |
          cargo build --release

      # 3. 自动递归收集 FolderPlay.exe 依赖的所有 MinGW DLL 文件
      - name: Prepare Artifacts and Copy DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp target/release/FolderPlay.exe dist/
          
          # 使用 ldd 扫描 FolderPlay.exe 依赖的所有来自 /mingw64/bin 的 dll 并自动复制到 dist 目录
          cd dist
          ldd FolderPlay.exe | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp {} .
          
          # 再次对刚复制进来的 dll 进行 ldd 扫描，防止漏掉二级依赖（如 cairo/pango/harfbuzz 等）
          for i in {1..2}; do
            for dll in *.dll; do
              ldd "$dll" 2>/dev/null | grep /mingw64/bin | awk '{print $3}' | xargs -I {} cp -n {} . 2>/dev/null || true
            done
          done

      # 4. 打包为 ZIP 供下载
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderPlay-Windows-x64
          path: dist/