name: Build Windows Executable

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libadwaita >= 1.6 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            valac \
            libgtk-4-dev \
            libgraphene-1.0-dev \
            libpango1.0-dev \
            libglib2.0-dev \
            gettext
          
          git clone --depth 1 --branch 1.6.0 https://gitlab.gnome.org/GNOME/libadwaita.git
          cd libadwaita
          
          meson setup _build --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu
          ninja -C _build
          sudo ninja -C _build install
          
          sudo ldconfig
          cd ..
          
          pkg-config --modversion libadwaita-1

      - name: Install other system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            pkg-config \
            libgtk-4-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly
          
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Configure Cargo for cross-compilation
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Build for Windows
        run: |
          cargo build --target ${{ env.TARGET }} --release --verbose

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FolderPlay-Windows-x64
          path: target/x86_64-pc-windows-gnu/release/FolderPlay.exe