name: Build Windows Executable

on:
  workflow_dispatch:  # 保留手动触发

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 关键修复：更彻底地安装GTK4及其交叉编译依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            pkg-config \
            libgtk-4-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libadwaita-1-dev \
            librsvg2-dev  # FolderPlay可能需要的SVG渲染库
          
          # 设置环境变量，帮助pkg-config找到库路径
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          # 为交叉编译设置正确的环境变量
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      # 修复：使用更现代的dtolnay/rust-toolchain，避免actions-rs的警告
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Configure Cargo for cross-compilation
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      # 尝试编译，并输出更详细的错误信息
      - name: Build for Windows
        run: |
          cargo build --target ${{ env.TARGET }} --release --verbose

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FolderPlay-Windows-x64
          path: target/x86_64-pc-windows-gnu/release/FolderPlay.exe